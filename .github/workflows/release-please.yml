name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing
        run: npm install -g npm@^11
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE }}
