name: Publish

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to stage.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing
        run: npm install -g npm@^11
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package version $expected"
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE }}
